name: ci
on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check notion_pilot_powers tests
      - run: uv run pytest -q
