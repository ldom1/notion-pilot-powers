name: skill-zips
# One zip per skill on each GitHub Release, for Customize > Skills > Upload skill in the Claude app.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zips to
        required: true
permissions:
  contents: write
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Zip each skill folder and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd skills
          for d in */; do zip -qr "../${d%/}.zip" "$d" -x "*/evals/*"; done
          cd ..
          gh release upload "$TAG" ./*.zip --clobber
