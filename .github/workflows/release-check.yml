name: release-check
on:
  push:
    tags: ['v*']
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .mcp.json must pin this release's own tag
        run: |
          pin=$(python3 -c "import json;print(json.load(open('.mcp.json'))['mcpServers']['notion-pilot-powers']['args'][1].split('@')[-1])")
          test "$pin" = "${GITHUB_REF_NAME}"
