[project]
name = "notion-pilot-powers"
version = "0.1.0"
description = "CRM core + local MCP for Notion Pilot — skills and tools that run on your machine"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Louis Giron", email = "louis@giron-dom.eu" }]
readme = "README.md"
dependencies = [
    "notion-client~=2.2",
    "pydantic-settings~=2.5",
    "httpx~=0.27",
    "loguru~=0.7",
    "rapidfuzz~=3.14",
    "mcp~=1.28",
]

[project.scripts]
notion-pilot-powers = "notion_pilot_powers.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notion_pilot_powers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["notion_pilot_powers", "tests"]

[tool.ruff.lint]
ignore = ["DTZ011", "C408", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
